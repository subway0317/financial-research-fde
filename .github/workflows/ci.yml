name: Research CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/financial_research
      - run: python -m pip check
      - run: git diff --check
      - run: python -m financial_research.evals.cli --mode offline --validate-only
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run api:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
        env:
          OPENAI_API_KEY: __FRONTEND_SECRET_SENTINEL__
          SEC_USER_AGENT: __SEC_CONTACT_SENTINEL__
          VITE_OPENAI_API_KEY: __VITE_SECRET_SENTINEL__
